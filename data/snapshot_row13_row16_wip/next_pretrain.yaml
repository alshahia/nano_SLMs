# wiring only — the RUN is user-gated until the user opens the next pretrain
# window (TASKS row 13; research/pretrain_mix_proposal.md §5)
#
# Milestone D next-pretrain config: model dims from configs/pilot.yaml
# (12L/d768/12kv4/ffn2048, tied embeddings) at ctx 1024; data = the §2.2 mix
# as four dataset_candidates, each with a per-candidate target_rows so
# prepare_data.py runs in MIX mode (all four fetched, each capped, ONE
# shared SHA1 exact-dup set across sources -> raw/source_stats.json).
name: next_pretrain

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 12               # pilot dims from here down, ctx raised 512 -> 1024
  hidden: 768
  heads: 12
  kv_heads: 4
  ffn: 2048
  ctx: 1024
  dropout: 0.0
  tie_embeddings: true

data:
  # Mix mode: every candidate carries target_rows -> ALL are fetched (no
  # first-hit fallback), each capped at target_rows, cross-source SHA1 dedupe.
  # rows: is kept schema-complete with target.yaml but is IGNORED in mix mode
  # (230000 = 10000 + 200000 + 15000 + 5000).
  dataset_candidates:
    - name: bigcode/the-stack-smol             # 30 langs x 10k rows; ungated now
      data_dir: data/python                    # its 'python' builder config is GONE
      target_rows: 10000                       # (only 'default' remains, probed 2026-09-09)
    - name: bigcode/starcoderdata              # workhorse; gated (HF_TOKEN)
      config: python                           # data_dir=python
      target_rows: 200000
    - name: code-search-net/code_search_net    # ungated NL bridge (M3 source)
      config: python
      target_rows: 15000
    - name: nickrosh/Evol-Instruct-Code-80k-v1 # ungated instruct sliver
      target_rows: 5000
  rows: 230000               # ignored in mix mode; sum of target_rows
  val_fraction: 0.02
  dedupe: true
  min_chars: 200
  shard_tokens: 8000000
  raw_dir: data/next_pretrain/raw
  tokens_dir: data/next_pretrain/tokens

train:
  output_dir: runs/next_pretrain
  final_dir: runs/next_pretrain/final
  # 134M tokens / 32,768 tok-per-step = 4089.4 -> max_steps 4100
  # (32,768 = ctx 1024 x batch 1 x accum 32; 4100 x 32,768 = 134,348,800)
  max_steps: 4100
  batch: 1
  eval_batch: 2             # same 2x1024 eval tile as target.yaml (6/8 GB VRAM)
  accum: 32
  lr: 4.0e-4
  scheduler: cosine
  warmup_steps: 150
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 50
  # target.yaml cadence: save_steps a clean multiple of eval_steps (HF rule
  # with load_best_model_at_end); 100/100 = best + 2 latest rotation.
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  # Milestone B recorded default for the NEXT pretrain (TASKS row 11):
  # adamw_bnb_8bit + batch 1/accum 32 (loss parity, 1.02x pace, -563 MiB).
  optim: adamw_bnb_8bit
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 64
  prompts:
    - "def fibonacci(n):"
    - "import numpy as np\n\ndef mean_absolute_error(y_true, y_pred):"
    - "class Stack:"
