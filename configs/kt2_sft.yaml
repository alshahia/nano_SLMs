# KT-2 SFT (TASKS row 44): LoRA-SFT of the row-41 winner (final_a60) on its
# own best samples - the KT-2 judge round-1 winners (248 pairs, AST-gated,
# teacher-scored by SmolLM2-360M per the frozen row-14 protocol).
# Recipe = row-41 vehicle (Track F): LoRA r=32/alpha=64, lr 1e-4, 1-2 epochs
# (full-FT drifts the CSN guard; LoRA does not - h2_copy +0.13%).
# BATCHING (user request 2026-09-10): batch 4 / accum 4 = SAME effective
# batch 16 as row 41 (identical training math, ~2.5-3x faster wall).
# Scale notes: 248 pairs -> ~28 steps over 2 epochs; warmup scaled to 10
# (row-41's 100 assumed a 1200-step run); val_fraction raised 0.02 -> 0.08
# so the tiny corpus still gets ~20 val pairs (MEMORY 22: n_val uses TARGET
# rows -> rows set ~= corpus size).
name: kt2_sft

base_model: runs/yarn_lora_sft_v1/final_a60

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 16
  hidden: 1024
  heads: 16
  kv_heads: 4
  ffn: 3072
  ctx: 1024
  dropout: 0.0
  tie_embeddings: true

peft:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none

data:
  dataset: data/sft/kt2_judge/pairs.jsonl
  raw_dir: data/sft/kt2_judge
  dataset_dir: data/sft/kt2_judge/ds
  tokens_dir: data/target/tokens
  rows: 248
  val_fraction: 0.08
  min_chars: 30
  min_instruction_chars: 10
  dedupe: true
  ast_filter: true
  template: "### Instruction:\n{instruction}\n### Response:\n"

sft:
  ctx: 512

train:
  output_dir: runs/kt2_sft
  final_dir: runs/kt2_sft/final
  epochs: 2
  batch: 4                  # x accum 4 = effective 16 (= row 41's batch1 x16)
  eval_batch: 8
  accum: 4
  lr: 1.0e-4
  scheduler: cosine
  warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 14
  save_steps: 14
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  optim: adamw_torch
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 256
  instructions_file: data/sft/minimax3/val_instructions.jsonl
  n_instructions: 50
  sample_temperature: 0.8
  prompts:
    - "### Instruction:\nWrite a Python function that returns the nth Fibonacci number.\n### Response:\n"
    - "### Instruction:\nWrite a Python class that implements a stack with push, pop and peek.\n### Response:\n"
