# Milestone B arm: B, 8-bit AdamW (adamw_bnb_8bit, bitsandbytes 0.50.2 - installed, sm_75 verified)
# Post-M3 ONLY - never co-run with live training (GPU A/B protocol:
# research/milestone_b_8bit_ab.md). Isolated run dir; runs/pilot (M2 final)
# is never touched. Same data/tokens + seed as the M2 pilot so the three
# arms are comparable at equal steps.

name: pilot-b8

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 12
  hidden: 768
  heads: 12
  kv_heads: 4
  ffn: 2048
  ctx: 512
  dropout: 0.0
  tie_embeddings: true

data:
  dataset_candidates:
    - name: bigcode/the-stack-smol
      data_dir: data/python   # 'config: python' builder is GONE from the Hub (only 'default' remains; probed 2026-09-09)
    - name: bigcode/starcoderdata
      config: python
    - name: nickrosh/Evol-Instruct-Code-80k-v1
  rows: 50000
  val_fraction: 0.02
  dedupe: true
  min_chars: 200
  shard_tokens: 8000000
  raw_dir: data/pilot/raw
  tokens_dir: data/pilot/tokens

train:
  output_dir: runs/pilot-b8
  final_dir: runs/pilot-b8/final
  max_steps: 500
  batch: 1
  eval_batch: 4
  accum: 32
  lr: 4.0e-4
  scheduler: cosine
  warmup_steps: 50
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 125
  save_steps: 250
  save_total_limit: 2
  fp16: true
  grad_ckpt: true
  optim: adamw_bnb_8bit
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 64
  prompts:
    - "def fibonacci(n):"
    - "import numpy as np\n\ndef mean_absolute_error(y_true, y_pred):"
    - "class Stack:"
