# ME-mex_x4: micro-expert X4 config (DESIGN ME-D1; schema = configs/smoke.yaml).
name: mex_x4

tokenizer:
  name: data/mex/tokenizer     # local dir saved by Task 1 (AutoTokenizer-compatible)
  vocab_size: 97

model:
  layers: 2
  hidden: 80
  heads: 4
  kv_heads: 2
  ffn: 320
  ctx: 96
  dropout: 0.0
  tie_embeddings: true

data:
  dataset_candidates:
    - name: local-mex-x4   # unused by train.py: shards are pre-packed
  rows: 0
  val_fraction: 0.02
  shard_tokens: 2000000
  raw_dir: data/mex/x4
  tokens_dir: data/mex/x4/tokens

train:
  output_dir: runs/mex/x4
  final_dir: runs/mex/x4/final
  max_steps: 12000
  batch: 8
  eval_batch: 16
  accum: 4
  lr: 1.0e-3
  scheduler: cosine
  warmup_steps: 20
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 50
  eval_steps: 250
  save_steps: 250
  save_total_limit: 3
  fp16: true
  grad_ckpt: false
  optim: adamw_bnb_8bit
  dataloader_num_workers: 0
  seed: 42
