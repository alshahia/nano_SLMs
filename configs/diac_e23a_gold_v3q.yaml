# E-23a (S1) — gold 30M arch + v3q tokens (v3 pool + gate-deduped QCRI 362k windows)
# EXACT stage2b2500 schedule except tokens_phase; warm-start identical.
phase: e23a_gold_v3q
tokens_phase: v3q
pretrained_init: runs/diac/stage1lm/final/model.pt
reset_last_n_layers: 2
batch_size: 32
accum: 1
lr: 0.0002
weight_decay: 0.1
total_steps: 2500
save_every: 500
eval_every: 500
gate_eval_every: 500       # finer probes than gold's 2500: catch best point
early_stop_patience: 8
log_every: 100
model:
  ctx: 128
  hidden: 272
  ffn: 1088
  layers: 28
  n_heads: 8
  n_kv: 2
