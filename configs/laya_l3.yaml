# Laya-line L3 (E-65): from-scratch ~50M BERT encoder, domain-matched MLM pretrain.
# Pre-registration: research/EXPERIMENTS.md E-65 (2026-09-22, user-approved).
corpus_bin: data/laya/l3_corpus/train.bin
heldout_bin: data/laya/l3_corpus/heldout.bin
tokenizer: microsoft/MiniLM-L12-H384-uncased
vocab_size: 30522
hidden: 512
layers: 6
heads: 8
ffn: 2048
max_pos: 512
seq: 256
micro_batch: 48
grad_accum: 1
lr: 6.0e-4
warmup_steps: 1000
total_tokens: 3.0e+8
weight_decay: 0.01
mask_prob: 0.15
out_dir: runs/laya/l3
save_every_steps: 1000
log_every_steps: 200
eval_every_steps: 2000
vram_fraction: 0.9
# --- ladder (stage A mixture -> stage B typed) ---
encoder: runs/laya/l3/pretrain_final/encoder
mixture_train: data/laya/mixture/train.pt
mixture_heldout: data/laya/mixture/heldout.pt
typed_train: data/laya/typed_decisions/train.pt
typed_test: data/laya/typed_decisions/test.pt
max_len: 512
head_max_len: 192
option_token_max: 48
epochs_stageA_max: 5
plateau_min_gain: 0.01
epochs_stageB: 4
replay_frac: 0.15
order_aug_prob: 0.5
rename_aug_prob: 0.25
micro_batch: 8
grad_accum: 8
lr_encoder: 2.5e-5
lr_head: 1.0e-4
weight_decay: 0.01
clip: 1.0
seed: 42
save_every_steps: 200
