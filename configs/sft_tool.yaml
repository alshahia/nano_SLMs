# Tool-call SFT (2026-11-02, user-approved "Yes, both"): teach the NS bench's Python tool-call format
# (stubs + handle_request body) on top of the best checkpoint, with replay to hold fix/write_fn.
# Data: scripts/tool_sft_gen.py -> data/tool_sft (xlam rows rewritten as Python stubs + Gemini rows on topics
# disjoint from the bench, decontaminated against data/bench/ns/B_tool_call) + replay from data/sa_b_scoped/sa4.
# Same recipe as configs/sft_sa_b.yaml except base_model, dataset_dir and output paths.
# Then: scratch/lora_scale_merge.py --base runs/sa_b_scale075 --scale 0.75 -> runs/tool_scale075; NS quick bench.
name: sft_tool

base_model: runs/sa_b_scale075

tokenizer:
  name: models/hf/SmolLM2-135M   # SmolLM2's own tokenizer (eos <|endoftext|>=0)
  vocab_size: 49152

model:
  ctx: 8192

data:
  dataset_dir: data/tool_sft/ds

sft:
  ctx: 1024
  pilot_rows: 2048

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none

train:
  output_dir: runs/sft_tool
  final_dir: runs/sft_tool/final
  epochs: 1
  batch: 8
  eval_batch: 8
  accum: 8
  lr: 1.0e-4
  scheduler: cosine
  warmup_steps: 30
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  optim: adamw_torch
  dataloader_num_workers: 2
  seed: 42
