# KT-2 SFT round 2 (TASKS row 48): FRESH LoRA (NOT chained onto kt2_sft/final)
# from the row-41 winner final_a60, because the combined corpus below ALREADY
# contains the round-1 pairs - chaining would double-count them.
# Corpus = r1 winners (248, data/sft/kt2_judge) + r2 winners (1490,
# data/sft/kt2_judge_r2) = 1738 pairs, AST-gated, 360M-judge scored.
# Rows ~= corpus size (MEMORY 22: n_val derived from rows). ~218 steps.
name: kt2_sft_r2b

base_model: runs/yarn_lora_sft_v1/final_a60

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 16
  hidden: 1024
  heads: 16
  kv_heads: 4
  ffn: 3072
  ctx: 1024
  dropout: 0.0
  tie_embeddings: true

peft:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none

data:
  dataset: data/sft/kt2_sft_r2/pairs.jsonl
  raw_dir: data/sft/kt2_sft_r2
  dataset_dir: data/sft/kt2_sft_r2/ds
  tokens_dir: data/target/tokens
  rows: 1738
  val_fraction: 0.06
  min_chars: 30
  min_instruction_chars: 10
  dedupe: true
  ast_filter: true
  template: "### Instruction:\n{instruction}\n### Response:\n"

sft:
  ctx: 512

train:
  output_dir: runs/kt2_sft_r2b
  final_dir: runs/kt2_sft_r2b/final
  epochs: 1
  batch: 4                  # x accum 4 = effective 16 (= row-41 math)
  eval_batch: 8
  accum: 4
  lr: 5.0e-5
  scheduler: cosine
  warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 5
  # NOTE r2b: 1 epoch @ 5e-5. r2 evidence: cosine LR hit 0 by step ~115
  # (half the run was a no-op); suspect is LR 1e-4 too hot, not epoch-2 overfit.
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  optim: adamw_torch
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 256
  instructions_file: data/sft/minimax3/val_instructions.jsonl
  n_instructions: 50
  sample_temperature: 0.8
  prompts:
    - "### Instruction:\nWrite a Python function that returns the nth Fibonacci number.\n### Response:\n"
    - "### Instruction:\nWrite a Python class that implements a stack with push, pop and peek.\n### Response:\n"