# Stage-1 smoke: 1500 steps, eval 250 (stability + pace measurement).
# VRAM retune for Quadro RTX 3000 (6144 MiB dedicated): micro-batch 8 + accum 4
# (effective batch 32) + HARD allocator ceiling 5.8 GiB via vram_cap_gib, so the
# process never spills past dedicated VRAM into Intel shared iGPU memory.
phase: stage1smoke
tokens_dir: stage1
causal: true
model:
  hidden: 272
  layers: 28
  n_heads: 8
  n_kv: 2
  ffn: 1088
  ctx: 512
lr: 2.0e-4
weight_decay: 0.1
batch_size: 8
accum: 4
eval_bs: 32
vram_cap_gib: 5.8
total_steps: 1500
save_every: 500
eval_every: 250
early_stop_patience: 12
