# OPTION A (user decision 2026-09-12): Fadel-classical specialist.
# SAME 30M deep-narrow arch as v2b (14L/384h/8h/2kv/ffn1536, ctx 128) but
# trained ONLY on the Fadel classical slice (fadel_train + 5% fadel_val carve-out)
# -- the two gates v1 won (Fadel test, WikiNews-2024) are the classical/MSA-heavy
# domain; a dedicated ckpt targets the remaining 5-7 pp there.
phase: fadel_spec
model:
  hidden: 384
  layers: 14
  n_heads: 8
  n_kv: 2
  ffn: 1536
  ctx: 128
lr: 2.0e-4
weight_decay: 0.1
batch_size: 32
accum: 1
total_steps: 6000
save_every: 500
log_every: 100
eval_every: 500
early_stop_patience: 8
