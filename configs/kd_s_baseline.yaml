# C12 Tier 3 fair A/B baseline (TASKS row 20): from-scratch S-sized run on
# the SAME data/steps/seed as configs/kd_s_t1.yaml - plain train.py, no KD
# code. The comparison (plan §5 read-out) is distilled vs THIS run.
# GATE: never while another training run is live on the GPU.
name: kd-s-baseline

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 4
  hidden: 256
  heads: 4
  kv_heads: 2
  ffn: 1024
  ctx: 512
  dropout: 0.0
  tie_embeddings: true

data:
  raw_dir: data/pilot/raw
  tokens_dir: data/pilot/tokens

train:
  output_dir: runs/kd-s-baseline
  final_dir: runs/kd-s-baseline/final
  max_steps: 2000          # identical to the KD arm
  batch: 8
  eval_batch: 8
  accum: 1
  lr: 4.0e-4
  scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 25
  eval_steps: 250
  save_steps: 250
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  optim: adamw_torch
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 64
  prompts:
    - "def fibonacci(n):"
