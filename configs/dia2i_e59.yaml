# E-59: ctx-192 long-context settle (flat v3qx shards re-read at seq_len 192).
name: dia2i_e59
base_run: runs/mex/dia2d_scale/final
tokenizer:
  name: data/mex/tokenizer
  vocab_size: 97
model:
  layers: 2
  hidden: 1280
  heads: 32
  kv_heads: 16
  ctx: 192
  ffn: 5120
  dropout: 0.0
  tie_embeddings: false
data:
  tokens_dir: data/mex/mu2/v3qx
lora:
  base_run: runs/mex/dia2d_scale/final
  r: 8
  alpha: 16
  dropout: 0.05
  targets: [q_proj, v_proj, gate_proj, up_proj, down_proj]
  corrupt: { mask_marks: true, mask_char: "|", hold_every: 3 }
train:
  output_dir: runs/mex/dia2i_ctx192
  final_dir: runs/mex/dia2i_ctx192/final
  seed: 42
  batch: 64
  accum: 4
  eval_batch: 64
  max_steps: 4000
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 3
  logging_steps: 50
  lr: 0.00005
  warmup_steps: 50
  scheduler: cosine
  weight_decay: 0.1
  max_grad_norm: 1.0
  fp16: true
  grad_ckpt: false
