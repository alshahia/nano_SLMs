# D-line depth ablation (user request 2026-09-13): params-matched depth x2
# against v2b. SAME data (tokens_phase: v2b), seeds, lr, batch, ctx, gates.
# 28L/272h/8h/2kv/ffn1088/ctx128 ~ 30.45M params (v2b = 30,016,128).
# Only depth/width distribution changes; head_dim drops 64 -> 34 (declared
# confounder of the params-exact constraint).
phase: v2d28
tokens_phase: v2b
model:
  hidden: 272
  layers: 28
  n_heads: 8
  n_kv: 2
  ffn: 1088
  ctx: 128
lr: 2.0e-4
weight_decay: 0.1
batch_size: 32
accum: 1
total_steps: 30000
save_every: 500
log_every: 100
eval_every: 500
early_stop_patience: 12
