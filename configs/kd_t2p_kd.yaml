# Track C (TASKS row 31, adoption_plan §C): T-as-teacher KD at P scale -
# frozen 226.5M runs/target/final teaches a P-arch student (12L/768, ~110M)
# on the packed CSN shards (data/target/tokens, ctx 1024). Same tokenizer
# (CodeLlama 32768) -> logit KD is defined. Fair A/B: configs/kd_t2p_baseline.yaml
# is the SAME run without KD (plain train.py, identical data/steps/seed/
# optimizer). Read-out (row 20 recipe at scale): distilled >= baseline at
# <= 1/3 the steps (evals at 600/700 vs 2000) -> future P rungs get distilled
# instead of pretrained. GATE: never while another training run is live.
name: kd-t2p-kd

tokenizer:
  name: codellama/CodeLlama-7b-hf
  vocab_size: 32768

model:
  layers: 12
  hidden: 768
  heads: 12
  kv_heads: 4
  ffn: 2048
  ctx: 1024
  dropout: 0.0
  tie_embeddings: true

kd:
  teacher: runs/target/final
  tau: 1.0
  alpha: 0.5               # 0.5*KL + 0.5*CE blend (row 20 recipe, scaled up)

data:
  raw_dir: data/target/raw
  tokens_dir: data/target/tokens

train:
  output_dir: runs/kd-t2p-kd
  final_dir: runs/kd-t2p-kd/final
  max_steps: 2000          # identical to the baseline arm
  batch: 4                 # micro 4 x accum 2 = effective 8; VRAM ladder measured: b8 7897/8192 (96 pct, OOM-risk) -> b4/a2 FULL probe cycle peak 7010 (86 pct) = chosen; b2/a4 train was 4926 but its b8-eval transient spiked 7486 -> eval stays at 4; row-11 b/a precedent
  eval_batch: 4
  accum: 2
  lr: 4.0e-4
  scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 25
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  fp16: true
  grad_ckpt: true
  optim: adamw_bnb_8bit
  dataloader_num_workers: 0
  seed: 42

eval:
  max_new_tokens: 64
  prompts:
    - "def fibonacci(n):"
