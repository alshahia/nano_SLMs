# Large model training config with all data
name: large_all_data

model:
  type: vit_decoder
  patch_size: 16
  image_height: 48
  image_width: 256
  vit_layers: 8  # Deeper ViT
  vit_hidden: 512  # Larger hidden
  vit_heads: 8
  vit_ffn: 2048
  decoder_layers: 8  # Deeper decoder
  decoder_hidden: 512
  decoder_heads: 8
  vocab_size: 256
  max_seq_len: 64
  dropout: 0.15  # Higher dropout for regularization

data:
  train_dir: data/all_data/train
  val_dir: data/all_data/val
  batch_size: 32
  num_workers: 4
  image_height: 48
  image_width: 256
  augment: true

train:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_dir: runs/large_all_data
  log_interval: 50
  eval_interval: 1

eval:
  batch_size: 64
  max_new_tokens: 64
