# Focused training config with smaller vocabulary
name: focused

model:
  type: vit_decoder
  patch_size: 16
  image_height: 48
  image_width: 256
  vit_layers: 6
  vit_hidden: 384
  vit_heads: 6
  vit_ffn: 1536
  decoder_layers: 6
  decoder_hidden: 384
  decoder_heads: 6
  vocab_size: 54  # Focused vocabulary size
  max_seq_len: 64
  dropout: 0.2

data:
  train_dir: data/all_data/train
  val_dir: data/all_data/val
  batch_size: 64
  num_workers: 4
  image_height: 48
  image_width: 256
  augment: true
  vocab_path: data/focused_vocab.json

train:
  epochs: 50
  lr: 0.00005
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_dir: runs/focused
  log_interval: 50
  eval_interval: 1

eval:
  batch_size: 128
  max_new_tokens: 64
