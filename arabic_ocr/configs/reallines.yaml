name: reallines
model:
  type: vit_decoder
  patch_size: 16
  image_height: 48
  image_width: 512
  vit_layers: 4
  vit_hidden: 256
  vit_heads: 4
  vit_ffn: 1024
  decoder_layers: 4
  decoder_hidden: 256
  decoder_heads: 4
  vocab_size: 54
  max_seq_len: 200
  dropout: 0.1
data:
  train_dir: data/reallines/train
  val_dir: data/reallines/val
  batch_size: 32
  num_workers: 4
  image_height: 48
  image_width: 512
  augment: true
  vocab_path: data/focused_vocab.json
  max_len: 200
  min_text_len: 4
  max_text_len: 200
  keep_aspect: true
train:
  model_type: vit_decoder
  epochs: 60
  lr: 0.0003
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_dir: runs/reallines
  log_interval: 20
  eval_interval: 2
  eval_generate: false    # fast teacher-forced monitoring; honest AR eval is run separately
eval:
  batch_size: 32
  max_new_tokens: 200
