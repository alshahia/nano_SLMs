name: crnn_tiny
model:
  type: crnn
  image_height: 64
  image_width: 1024
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  vocab_size: 256
data:
  train_dir: data/linecorpus_tiny/train
  val_dir: data/linecorpus_tiny/val
  batch_size: 8
  num_workers: 0
  image_height: 64
  image_width: 1024
  augment: true
  vocab_path: data/linecorpus_vocab.json
  max_len: 192
  min_text_len: 2
  max_text_len: 48
  keep_aspect: true
train:
  model_type: crnn
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  save_dir: runs/crnn_tiny
  log_interval: 50
  eval_interval: 1
  eval_generate: false
eval:
  batch_size: 64
