# Full training config for Arabic OCR
name: full

model:
  type: crnn
  vocab_size: 256
  image_height: 48
  image_width: 256
  cnn_channels: [32, 64, 128, 256]
  cnn_kernel: 3
  cnn_stride: 2
  cnn_padding: 1
  lstm_hidden: 256
  lstm_layers: 2
  lstm_dropout: 0.1
  dropout: 0.1

data:
  train_dir: data/full/train
  val_dir: data/full/val
  batch_size: 32
  num_workers: 4
  image_height: 48
  image_width: 256

train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_dir: runs/full
  log_interval: 100
  eval_interval: 1

eval:
  batch_size: 64
  max_new_tokens: 64
